name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy matplotlib requests langdetect pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Re-score every committed transcript and re-derive the verdicts
        run: PYTHONPATH=src python -m guidebench.check
